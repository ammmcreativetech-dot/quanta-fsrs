name: Manual package checks and npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact package.json version reviewed for this release'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test

  publish:
    name: Explicit npm release
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - name: Check the explicitly selected manifest version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const p=require("./package.json"); if(p.version!==process.env.REQUESTED_VERSION) { console.error("Requested version must match the reviewed package.json version"); process.exit(1); }'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Publish the reviewed package version
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
